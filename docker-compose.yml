services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: prestamos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - prestamos_sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          ( /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q 'SELECT 1'
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -Q 'SELECT 1' ) || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend/prestamos-api
    container_name: prestamos-api
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=prestamos_db;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: prestamos-web
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  prestamos_sqlserver_data:
