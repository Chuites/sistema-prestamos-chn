spring.application.name=prestamos-api

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=prestamos_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.seed.enabled=${APP_SEED_ENABLED:false}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.document-title=API Sistema de Préstamos
springdoc.api-docs.path=/v3/api-docs